server {
  listen 80;
  server_name playground.yigeren.me;

  location /.well-known/acme-challenge/ {
    root /etc/nginx/certs/acme-webroot;
    default_type text/plain;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name playground.yigeren.me;

  ssl_certificate /etc/nginx/certs/letsencrypt/live/playground.yigeren.me/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/letsencrypt/live/playground.yigeren.me/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  location / {
    proxy_pass http://previewdock-web:80;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
